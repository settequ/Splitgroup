app = "splitgroup"
primary_region = "cdg"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "splitgroup_data"
  destination = "/data"

[env]
  DB_PATH = "/data/splitgroup.db"
  PORT = "8080"
